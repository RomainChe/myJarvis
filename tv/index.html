<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>JARVIS TV</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="tv.css">
<script defer src="nav.js"></script>
<script defer src="tv.js"></script>
</head>
<body>
<div class="halo" aria-hidden="true"></div>

<header class="top">
  <div class="when">
    <p class="greet" id="greet"></p>
    <p class="now"><time class="clock" id="clock"></time><span class="date" id="date"></span>
      <span class="weather"><svg class="ico" viewBox="0 0 24 24" stroke="#FBBF24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>14 °C<span class="sub">Ensoleillé · 9° / 17°</span></span></p>
  </div>
  <div class="tiles pills" aria-label="Raccourcis">
    <span class="status" id="status" role="status"></span>
    <button class="tile pill" data-color="#38CFEF" data-app="inputs" data-say="Source : HDMI 1">Sources</button>
    <button class="tile pill" data-color="#38CFEF" data-app="settings" data-say="Ouvrirait les réglages de la TV">Réglages</button>
    <button class="tile pill" data-color="#4285F4" data-app="googletv" data-say="Ouvrirait l'accueil Google TV">Accueil Google TV</button>
  </div>
</header>

<h1 class="hero" id="hero" aria-live="polite"></h1>

<main id="rows">
  <section class="row" aria-label="Applications">
    <div class="tiles">
      <button class="tile app" data-color="#E50914" data-app="netflix" data-say="Ouvrirait Netflix"><img src="logos/netflix.svg" alt="Netflix"></button>
      <button class="tile app" data-color="#1A98FF" data-app="primevideo" data-say="Ouvrirait Prime Video"><img src="logos/primevideo.svg" alt="Prime Video"></button>
      <button class="tile app" data-color="#FF0033" data-app="youtube" data-say="Ouvrirait YouTube"><img src="logos/youtube.svg" alt="YouTube"></button>
      <button class="tile app" data-color="#113CCF" data-app="disneyplus" data-say="Ouvrirait Disney+"><img src="logos/disneyplus.svg" alt="Disney+"></button>
      <button class="tile app" data-color="#1DB954" data-app="spotify" data-say="Ouvrirait Spotify"><img src="logos/spotify.svg" alt="Spotify"></button>
      <button class="tile app" data-color="#E5A00D" data-app="plex" data-say="Ouvrirait Plex"><img src="logos/plex.svg" alt="Plex"></button>
      <button class="tile app" data-color="#01875F" data-app="playstore" data-say="Ouvrirait le Play Store"><img src="logos/playstore.svg" alt="Play Store"></button>
      <button class="tile app" data-color="#38CFEF" data-app="livetv" data-say="Ouvrirait la TV en direct"><span class="big">TV en direct</span></button>
    </div>
  </section>

  <section class="row" aria-labelledby="t-maison">
    <h2 id="t-maison">Maison</h2>
    <div class="tiles">
      <button class="tile jarvis" data-color="#F59E0B" data-say="Lumières du salon : éteintes"><svg class="ico" viewBox="0 0 24 24" stroke="#F59E0B" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg><span class="big">Salon</span><span class="sub">Lumières allumées</span></button>
      <button class="tile jarvis" data-color="#FF7A45" data-say="Clim salon réglée à 22 °C"><svg class="ico" viewBox="0 0 24 24" stroke="#FF7A45" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-7 0-4-3-6.5-4-9-1 2-2 3-3.5 3.5C11 7 11 4 9.5 2 8.5 6 5 8.5 5 15c0 4.3 3 7 7 7z"/></svg><span class="big">21 °C</span><span class="sub">Clim salon · chauffe</span></button>
      <button class="tile jarvis" data-color="#38CFEF" data-say="Clim chambre allumée"><svg class="ico" viewBox="0 0 24 24" stroke="#38CFEF" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg><span class="big">19 °C</span><span class="sub">Clim chambre · éteinte</span></button>
      <button class="tile jarvis" data-color="#A78BFA" data-say="Scène Cinéma lancée"><svg class="ico" viewBox="0 0 24 24" stroke="#A78BFA" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9 19.5 4.5l.8 2.9M8 7.6l2.4 2M13.5 6.1l2.4 2"/></svg><span class="big">Cinéma</span><span class="sub">Scène</span></button>
      <button class="tile jarvis" data-color="#6366F1" data-say="Scène Bonne nuit lancée"><svg class="ico" viewBox="0 0 24 24" stroke="#818CF8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span class="big">Bonne nuit</span><span class="sub">Scène</span></button>
    </div>
  </section>

  <section class="row" aria-labelledby="t-jarvis">
    <h2 id="t-jarvis">JARVIS</h2>
    <div class="tiles">
      <button class="tile jarvis" data-color="#38CFEF" data-say="JARVIS écoute…"><span class="big">Demander</span><span class="sub">Parler à JARVIS</span></button>
      <button class="tile jarvis" data-color="#38CFEF" data-say="Aucun rappel aujourd'hui"><span class="big">Rappels</span><span class="sub">Aucun aujourd'hui</span></button>
      <button class="tile jarvis" data-color="#38CFEF" data-say="Lecture du briefing du matin"><span class="big">Briefing</span><span class="sub">Météo, agenda</span></button>
    </div>
  </section>
</main>

<p class="hint">Flèches : se déplacer · Entrée : valider · Échap : retour · H : simuler JARVIS hors ligne</p>
<div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
