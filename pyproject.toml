[project]
name = "jarvis"
version = "0.1.0"
description = "Assistant personnel pour PC et maison connectée"
requires-python = ">=3.12"
dependencies = ["keyring>=25", "fastapi==0.142.4", "uvicorn==0.54.0", "segno==1.6.6", "cryptography==50.0.2"]

[project.optional-dependencies]
voice = ["faster-whisper==1.2.1", "openwakeword==0.6.0", "piper-tts==1.8.0", "sounddevice==0.5.6"]
