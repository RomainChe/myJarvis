plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.jarvis.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.jarvis.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // L'interface est celle de la maquette (tv/ à la racine du dépôt), embarquée telle quelle : une seule source.
    sourceSets {
        main {
            assets.srcDirs = ['../../tv', 'src/main/assets'] // + sitenav.js (sites Bowd/OpenFlix)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// tv/logos/ est hors Git (absent d'un worktree neuf) : sans lui, les tuiles n'affichent que les noms.
tasks.named('preBuild') {
    doFirst {
        if (!file('../../tv/logos').list()) throw new GradleException('tv/logos/ vide ou absent : lancer python scripts/tv_logos.py')
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
